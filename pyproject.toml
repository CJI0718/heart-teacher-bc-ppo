[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-teacher-bc-ppo"
version = "0.1.0"
description = "Observable linear Hearts teacher, attention behavioral cloning, and PPO"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "jax==0.12.0.1",
  "numpy==2.5.4",
  "optax==0.2.8",
  "heart-marl @ git+https://github.com/funny-rl/Heart.git@ad122dba1e1d4c0aaee9bee8846ceba60ed680fe",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]
export = ["flatbuffers==25.12.19"]

[project.scripts]
heart-study = "heart_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
